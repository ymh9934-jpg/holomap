<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>서부교회 안내도</title>
<style>
/* VOICE 따뜻하고 차분한 안내 · IDEA 원목 건축 모형 · COLOUR 아이보리, 원목, 서부교회 하늘색·초록 */
:root{--bg1:#f7f3ec;--bg2:#e9e1d3;--ink:#2b2a27;--sub:#7b7468;--sky:#2f86c8;--leaf:#7fb53a;--wood:#c9a46e;--line:#e3d8c6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);
 background:radial-gradient(ellipse at 45% 40%,#fffdf9 0%,var(--bg1) 45%,var(--bg2) 100%);
 font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Samsung Sans",sans-serif}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#head{position:fixed;top:26px;left:32px;display:flex;align-items:center;gap:14px;touch-action:none;-webkit-touch-callout:none}
.logo{width:46px;height:46px;border-radius:6px;overflow:hidden;position:relative;flex:none;background:linear-gradient(var(--sky) 0 58%,var(--leaf) 58% 100%)}
.logo:before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:4px;margin-left:-2px;background:#fff;border-radius:2px}
.logo:after{content:"";position:absolute;left:11px;right:11px;top:17px;height:4px;background:#fff;border-radius:2px}
#head small{display:block;font-size:13px;color:var(--sub);letter-spacing:.04em}
#head b{display:block;font-size:28px;font-weight:800;letter-spacing:-.01em}
#head .ring{position:absolute;left:-6px;top:-6px;width:58px;height:58px;border-radius:12px;border:3px solid var(--sky);opacity:0;transform:scale(.8);transition:opacity .2s}
#head.press .ring{opacity:1;transform:scale(1);transition:opacity .2s,transform 1.2s linear}
#floors{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.fb{width:210px;padding:12px 16px;border:0;background:rgba(255,255,255,.85);color:var(--ink);font-size:16px;text-align:left;
 border-radius:14px;font-family:inherit;display:flex;align-items:center;gap:12px;white-space:nowrap;
 box-shadow:0 2px 10px rgba(80,60,30,.08);transition:all .25s}
.fb b{font-size:20px;font-weight:800;min-width:40px;color:var(--sky)}
.fb.on{background:var(--sky);color:#fff;box-shadow:0 6px 18px rgba(47,134,200,.35)}
.fb.on b{color:#fff}
#allBtn{margin-top:6px;justify-content:center;font-weight:700;background:rgba(255,255,255,.6)}
#allBtn.on{background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:15px;font-weight:600;padding:6px 12px 6px 10px;
 background:#fff;border-radius:20px;color:var(--ink);box-shadow:0 3px 12px rgba(60,40,10,.18);pointer-events:auto;transition:opacity .3s;
 display:flex;align-items:center;gap:7px}
.lb i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lb.fl{transform:translate(-100%,-50%);background:none;box-shadow:none;padding:0;font-weight:500;color:var(--sub);pointer-events:none}
.lb.fl b{font-size:19px;color:var(--ink);font-weight:800;margin-right:4px}
.lb.sel{background:var(--ink);color:#fff}
.lb.core{font-size:12px;padding:4px 10px;background:rgba(255,255,255,.85);color:var(--sub)}
#card{position:fixed;left:32px;bottom:34px;width:380px;padding:22px 24px 24px;background:#fff;border-radius:20px;
 box-shadow:0 14px 40px rgba(60,40,10,.18);transform:translateY(40px);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s}
#card.show{transform:none;opacity:1;pointer-events:auto}
#card .f{font-size:14px;color:var(--sky);font-weight:700}
#card h2{font-size:30px;margin:4px 0 10px;font-weight:800}
#card p{font-size:16px;line-height:1.65;color:#55504a}
#card .x{position:absolute;right:12px;top:10px;width:44px;height:44px;font-size:26px;color:var(--sub);background:none;border:0}
#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--sub);pointer-events:none;transition:opacity .4s}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 background:rgba(247,243,236,.88);backdrop-filter:blur(6px);transition:opacity .7s}
#intro.hide{opacity:0;pointer-events:none}
#intro .logo{width:84px;height:84px;border-radius:12px;margin-bottom:26px}
#intro .logo:before{top:14px;bottom:14px;width:7px;margin-left:-3.5px}
#intro .logo:after{left:20px;right:20px;top:31px;height:7px}
#intro h1{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
#intro p{font-size:21px;color:var(--sub);margin:14px 0 40px}
#start{padding:18px 56px;font-size:21px;font-weight:700;color:#fff;background:var(--sky);border:0;border-radius:40px;font-family:inherit;
 box-shadow:0 10px 28px rgba(47,134,200,.35)}

/* ===== 설계도 편집기 ===== */
#ed{position:fixed;inset:0;background:#f7f3ec;display:flex;flex-direction:column;z-index:10;transition:opacity .3s}
#ed.hide{opacity:0;pointer-events:none}
.edtop{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#fff;box-shadow:0 2px 10px rgba(80,60,30,.08)}
.edtop>b{font-size:20px;font-weight:800;margin-right:8px;white-space:nowrap}
#edTabs{display:flex;gap:6px}
.tab{min-width:56px;height:44px;border:0;border-radius:12px;background:#f1ebe1;color:var(--ink);font:700 17px/1 inherit;font-family:inherit}
.tab.on{background:var(--sky);color:#fff}
.sp{flex:1}
.btn{height:44px;padding:0 18px;border:0;border-radius:12px;background:#f1ebe1;color:var(--ink);font-size:16px;font-weight:600;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--sky);color:#fff}
.btn.warn{background:#fbe4e1;color:#b8402f}
.btn:disabled{opacity:.4}
.edmain{flex:1;display:flex;min-height:0}
.edcv{flex:1;position:relative;min-width:0}
#edSvg{position:absolute;inset:12px 12px 40px;width:calc(100% - 24px);height:calc(100% - 52px);touch-action:none}
.edhint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:14px;color:var(--sub)}
#edSide{width:360px;flex:none;background:#fff;padding:20px;overflow-y:auto;box-shadow:-2px 0 10px rgba(80,60,30,.06);user-select:text;-webkit-user-select:text}
#edSide h3{font-size:22px;font-weight:800;margin-bottom:14px}
#edSide label{display:block;font-size:14px;font-weight:700;color:var(--sub);margin:14px 0 6px}
#edSide input[type=text],#edSide select,#edSide textarea{width:100%;font-size:17px;font-family:inherit;padding:10px 12px;border:1.5px solid #e3d8c6;border-radius:10px;background:#fffdf9;color:var(--ink)}
#edSide textarea{min-height:110px;resize:vertical;line-height:1.5}
#edSide input:focus,#edSide select:focus,#edSide textarea:focus{outline:none;border-color:var(--sky)}
#edSide .row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#edSide .chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);font-weight:500;margin-top:16px}
#edSide .chk input{width:22px;height:22px}
#edSide .size{font-size:14px;color:var(--sub);margin-top:10px}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:#f7f3ec;font-size:16px;font-family:inherit;color:var(--ink);text-align:left}
.ritem i{width:12px;height:12px;border-radius:3px;flex:none}
.note{font-size:13px;color:var(--sub);line-height:1.55;margin-top:10px}
#edSide hr{border:0;border-top:1px solid #eee5d8;margin:22px 0 6px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="head"><div class="logo"><span class="ring"></span></div><div><small>SEOBU CHURCH</small><b>서부교회 안내도</b></div></div>
<div id="floors"></div>
<div id="card"><button class="x" id="cardX">×</button><div class="f" id="cardF"></div><h2 id="cardT"></h2><p id="cardD"></p></div>

<div id="ed" class="hide">
  <div class="edtop"><b>설계도 편집</b><div id="edTabs"></div><span class="sp"></span>
    <button class="btn" id="edUndo">되돌리기</button><button class="btn" id="edAdd">+ 방 추가</button>
    <button class="btn" id="edClose">닫기</button><button class="btn pri" id="edSave">저장하고 보기</button></div>
  <div class="edmain">
    <div class="edcv"><svg id="edSvg" viewBox="-19.5 -13.5 39 27" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="edhint">방을 끌어서 옮기고, 선택한 방 모서리의 동그라미를 끌어서 크기를 바꿔요 · 점선은 아래층 배치예요</div></div>
    <aside id="edSide"></aside>
  </div>
</div>

   {n:'성가대실',r:[-8,-12,0,-2],kind:'worship',d:'성가대가 연습하고 준비하는 곳입니다.'},

   {n:'로비',r:[6,-2,18,6],kind:'lobby',d:'엘리베이터에서 내리면 바로 로비입니다. 안내 데스크에서 도움을 받으실 수 있어요.'},

<script>
{
const H=5, GAP=2.4, WALL=1.5;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let FLOORS;
try{const s=localStorage.getItem(STORE);FLOORS=s?JSON.parse(s):null}catch(e){FLOORS=null}
if(!Array.isArray(FLOORS)||!FLOORS.length)FLOORS=JSON.parse(JSON.stringify(DEFAULT_FLOORS));

const cv=$('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(38,1,0.5,600);
cam.position.set(62,52,70);
const ctl=new THREE.OrbitControls(cam,cv);
ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.target.set(0,13,0);
ctl.minDistance=28;ctl.maxDistance=180;ctl.maxPolarAngle=Math.PI*.47;ctl.enablePan=false;
ctl.rotateSpeed=.7;ctl.autoRotate=true;ctl.autoRotateSpeed=.5;

scene.add(new THREE.HemisphereLight(0xfffaf0,0xb8a58a,.75));
const sun=new THREE.DirectionalLight(0xfff3df,.75);sun.position.set(35,70,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-45;sc.right=45;sc.top=45;sc.bottom=-45;sc.near=10;sc.far=180;sun.shadow.bias=-.0006;sun.shadow.radius=4;
scene.add(sun);
const base=new THREE.Mesh(new THREE.CircleGeometry(40,72),new THREE.ShadowMaterial({opacity:.12}));
base.rotation.x=-Math.PI/2;base.receiveShadow=true;scene.add(base);
const disk=new THREE.Mesh(new THREE.CylinderGeometry(27,28,.6,72),new THREE.MeshStandardMaterial({color:0xd9ccb6,roughness:.95}));
disk.position.y=-.35;disk.receiveShadow=true;scene.add(disk);

const mcache={};
function mat(col,o){const k=col+JSON.stringify(o||{});if(!mcache[k])mcache[k]=new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.85,metalness:0,transparent:true},o||{}));return mcache[k]}
function box(g,w,h,d,x,y,z,m,noShadow){if(w<=0||h<=0||d<=0)return;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y+h/2,z);
  if(!noShadow){b.castShadow=true;b.receiveShadow=true}g.add(b);return b}
const K=k=>KINDS[k]||KINDS.etc;

/* 방 종류별 소품 — 방 크기에 맞춰 놓입니다 */
function deco(g,R,own){
  const [x0,z0,x1,z1]=R.r;const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  switch(R.kind){
  case 'sanctuary':{
    const sw=Math.min(5,w*.22);box(g,sw,.9,d*.66,x0+.3+sw/2,0,cz,own(mat(0xd9b27a)));
    box(g,1.4,1.3,1.1,x0+sw-.6,.9,cz,own(mat(0xc08a4a)));
    const cr=own(mat(0xb98a50)),czx=cz-d*.19;box(g,.35,5.5,.35,x0+.7,.9,czx,cr);box(g,.35,.35,2.6,x0+.7,4.6,czx,cr);
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(6.5,d*.27),3.6),own(new THREE.MeshBasicMaterial({color:0x7fc0ea,transparent:true})));
    scr.rotation.y=Math.PI/2;scr.position.set(x0+.4,6.2,cz);g.add(scr);
    const pew=own(mat(0xc08a4a)),bl=Math.max(1,(d-5)/2);
    for(let x=x0+sw+2.2;x<x1-1.2;x+=1.75)[-1,1].forEach(s=>box(g,.5,.9,bl,x,0,cz+s*(1+bl/2),pew));
    const dr=own(mat(0x6b5236));[-.31,-.1,.1,.31].forEach(f=>box(g,.1,2.4,Math.min(1.8,d*.08),x1-.2,0,cz+d*f,dr));
    break}
  case 'ev':{const em=own(mat(0x9aa0a6,{metalness:.5,roughness:.4}));const bw=Math.min(2.2,w*.5),bd=Math.min(1.6,d*.3);

function buildAll(){

    const o={F,g,i,mats:new Set(),rooms:[],baseY:i*(H+GAP),y:i*(H+GAP),ty:i*(H+GAP),off:new THREE.Vector3(),toff:new THREE.Vector3(),vis:1,tvis:1};
    const own=m=>{const c=m.clone();c.userData.base=m.opacity;o.mats.add(c);return c};
    const shp=new THREE.Shape();shp.moveTo(-18,-12);shp.lineTo(18,-12);shp.lineTo(18,12);shp.lineTo(-18,12);shp.closePath();
    const cl=(v,a)=>Math.max(-a,Math.min(a,v));
    F.rooms.filter(R=>R.kind==='void').forEach(R=>{const [a,b,c,d]=R.r;const h=new THREE.Path();
      const X0=cl(a+.3,17.6),Z0=cl(b+.3,11.6),X1=cl(c-.3,17.6),Z1=cl(d-.3,11.6);if(X1-X0<.5||Z1-Z0<.5)return;
      h.moveTo(X0,Z0);h.lineTo(X0,Z1);h.lineTo(X1,Z1);h.lineTo(X1,Z0);h.closePath();shp.holes.push(h)});
    const sg=new THREE.ExtrudeGeometry(shp,{depth:.7,bevelEnabled:false});sg.rotateX(Math.PI/2);
    const slab=new THREE.Mesh(sg,own(mat(0xf3ede3)));slab.castShadow=true;slab.receiveShadow=true;g.add(slab);

    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(sg),own(new THREE.LineBasicMaterial({color:0xc8b79c,transparent:true}))));
    if(F.roof){const wm=own(mat(0xe9dfcf));box(g,36,1.1,.3,0,0,-11.85,wm);box(g,36,1.1,.3,0,0,11.85,wm);box(g,.3,1.1,24,-17.85,0,0,wm);box(g,.3,1.1,24,17.85,0,0,wm)}
    const wallM=own(mat(0xd8b887,{roughness:.7})),glassM=own(mat(0x9fc8e6,{opacity:.45,roughness:.1}));
    F.rooms.forEach(R=>{

      const hit=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.2,w-.4),wh+.4,Math.max(.2,d-.4)),new THREE.MeshBasicMaterial({visible:false}));hit.position.set(cx,(wh+.4)/2,cz);g.add(hit);

      rm.el.addEventListener('click',ev=>{ev.stopPropagation();selectRoom(rm)})});
    o.meshes=[];g.traverse(c=>{if(c.isMesh&&c.castShadow)o.meshes.push(c)});

const mid=()=>new THREE.Vector3(0,(FLOORS.length-1)*(H+GAP)/2,0);
function flyTo(tgt,dist,elev){
  const dir=cam.position.clone().sub(ctl.target);dir.y=0;dir.normalize();
  const e=elev||.62;camGoal.tgt=tgt.clone();
  camGoal.pos=tgt.clone().add(new THREE.Vector3(dir.x*Math.cos(e),Math.sin(e),dir.z*Math.cos(e)).multiplyScalar(dist));camGoal.t=1;
}
function selectFloor(i){
  sel=i;selectRoom(null);
  floorObjs.forEach(o=>o.btn.classList.toggle('on',o.i===i));all.classList.toggle('on',i<0);
  if(i<0){floorObjs.forEach(o=>{o.ty=o.baseY;o.toff.set(0,0,0);o.tvis=1});flyTo(mid(),105,.55);ctl.autoRotate=true;return}
  ctl.autoRotate=false;
  floorObjs.forEach(o=>{if(o.i===i){o.ty=o.baseY;o.tvis=1}else if(o.i>i){o.ty=o.baseY+30;o.tvis=0}else{o.ty=o.baseY;o.tvis=.25}o.toff.set(0,0,0)});

const card=$('card');
function selectRoom(rm){

const ray=new THREE.Raycaster();let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};ctl.autoRotate=false;camGoal.t=0});
cv.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),quick=performance.now()-down.t<400;down=null;
  if(moved>10||!quick)return;
  const r=cv.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);

const endDrag=()=>{if(!drag)return;if(drag.moved){undo.push(drag.snap);if(undo.length>60)undo.shift();$('edUndo').disabled=false;dirty=true;resetClose()}drag=null;edPanel()};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
$('edUndo').onclick=()=>{if(!undo.length)return;draft=JSON.parse(undo.pop());$('edUndo').disabled=!undo.length;if(es>=(draft[ef]||{rooms:[]}).rooms.length)es=-1;edTabs();edDraw();edPanel()};
$('edAdd').onclick=()=>{snapshot();const F=draft[ef];F.rooms.push({n:'새 방',r:[-3,-3,3,3],kind:'etc',d:''});es=F.rooms.length-1;edDraw();edPanel();setTimeout(()=>{const n=$('pN');if(n){n.focus();n.select()}},50)};
function resetClose(){$('edClose').textContent='닫기';$('edClose').classList.remove('warn');closeArm=0}
let closeArm=0;
$('edClose').onclick=()=>{if(dirty&&!closeArm){closeArm=1;$('edClose').textContent='저장 안 하고 닫을까요?';$('edClose').classList.add('warn');return}ed.classList.add('hide');draft=null};
$('edSave').onclick=()=>{
  FLOORS=draft;try{localStorage.setItem(STORE,JSON.stringify(FLOORS))}catch(e){}
  const f=ef;buildAll();ed.classList.add('hide');draft=null;$('intro').classList.add('hide');setTimeout(()=>selectFloor(Math.min(f,floorObjs.length-1)),50);
};

/* 루프 */
const v=new THREE.Vector3();let last=performance.now();const hint=$('hint');
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const k=1-Math.pow(.003,dt);
  floorObjs.forEach(o=>{
    o.y+=(o.ty-o.y)*k;o.off.lerp(o.toff,k);o.vis+=(o.tvis-o.vis)*k;
    o.g.position.set(o.off.x,o.y,o.off.z);o.g.visible=o.vis>.02;
    const solid=o.vis>.9;
    o.mats.forEach(m=>{m.opacity=(m.userData.base==null?1:m.userData.base)*o.vis;m.depthWrite=solid});
    if(o.solid!==solid){o.solid=solid;o.meshes.forEach(c=>c.castShadow=solid)}
  });
  if(camGoal.t>0){cam.position.lerp(camGoal.pos,k*.9);ctl.target.lerp(camGoal.tgt,k*.9);if(cam.position.distanceTo(camGoal.pos)<.3)camGoal.t=0}
  ctl.update();
  const w=innerWidth,h=innerHeight;
  floorObjs.forEach(o=>{
    v.set(-18,.4,12).add(o.g.position);v.project(cam);
    o.flabel.style.opacity=sel<0&&v.z<1?1:0;
    o.flabel.style.left=((v.x+1)/2*w-28)+'px';o.flabel.style.top=((1-v.y)/2*h)+'px';
    o.rooms.forEach(rm=>{
      const on=o.i===sel&&o.vis>.6;
      v.copy(rm.center).add(o.g.position);v.project(cam);
      rm.el.style.opacity=on&&v.z<1?1:0;rm.el.style.pointerEvents=on?'auto':'none';
      rm.el.style.left=((v.x+1)/2*w)+'px';rm.el.style.top=((1-v.y)/2*h)+'px';
    });
  });
  hint.style.opacity=selRoom?0:1;
  if(ed.classList.contains('hide'))renderer.render(scene,cam);
}
buildAll();
requestAnimationFrame(loop);
window.__holo={selectFloor,selectRoom,get floorObjs(){return floorObjs},cam,ctl,openEditor};
}
</script>
